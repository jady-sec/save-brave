<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f47b20" />
    <meta name="description" content="Spend together. Save together." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Save Brave" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Save Brave</title>
  </head>
  <body>
    <!-- Opening animation, started by src/intro.ts once per app launch (until then it shows the still jar): the lid lifts, a coin each and one together drop in,
         the jar gives a happy wiggle, then the screen fades into the app. Tap to skip. -->
    <div id="intro" class="splash" aria-hidden="true">
      <svg viewBox="0 0 96 96">
        <g class="jar">
          <rect x="30" y="27" width="42" height="52" rx="12" fill="#111" />
          <rect x="27" y="24" width="42" height="52" rx="12" fill="#fff" stroke="#111" stroke-width="4" />
          <circle class="coin c1" cx="40" cy="64" r="8" fill="#2fd2b9" stroke="#111" stroke-width="3" />
          <circle class="coin c2" cx="56" cy="64" r="8" fill="#b98cff" stroke="#111" stroke-width="3" />
          <circle class="coin c3" cx="48" cy="50" r="8" fill="#ffd23f" stroke="#111" stroke-width="3" />
          <rect class="lid" x="31" y="16" width="34" height="10" rx="4" fill="#b98cff" stroke="#111" stroke-width="3.5" />
        </g>
        <g class="spark" stroke="#111" stroke-width="3" stroke-linecap="round">
          <path d="M76 22 L83 15" /><path d="M79 31 L88 30" /><path d="M70 14 L71 6" />
          <path d="M20 22 L13 15" /><path d="M17 31 L8 30" />
        </g>
      </svg>
      <p class="splash-name">Save Brave</p>
      <p class="splash-tag">Spend together. Save together.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
